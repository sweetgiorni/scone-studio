on:
  push:
    branches: [master, main]
    tags:
      - "v*"
      - "*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish GitHub release assets (otherwise only artifacts)."
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag/name to publish when publish_release=true (defaults to ref name)."
        required: false
        type: string

permissions:
  contents: write

env:
  OSG_INSTALL_PATH: /tmp/OpenSceneGraph-install
  SIMBODY_INSTALL_PATH: /tmp/simbody-install
  OPENSIM3_INSTALL_PATH: /tmp/opensim3-install
  CMAKE_VERBOSE_MAKEFILE: "False"

jobs:
  osx:
    # if: ${{ false }}
    name: Build on MacOS 13
    runs-on: macos-13

    steps:
    - uses: actions/checkout@v3

    - name: Setup CMake 3.27
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: 3.27.9

    - name: Check cmake version
      run: cmake --version

    - name: Get Brew
      run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"

    - name: Get Dependencies
      run: cd $GITHUB_WORKSPACE && ./tools/mac_1_get-dependencies

    - name: Check cmake version
      run: cmake --version

    - name: Check cache for openscenegraph
      id: cache_osg
      uses: actions/cache@v3
      with:
        path: ${{ env.OSG_INSTALL_PATH }}
        key: ${{ runner.os }}-osg-${{ hashFiles('OpenSceneGraph/src') }}

    - name: Build openscenegraph
      if: steps.cache_osg.outputs.cache-hit != 'true'
      run: cd $GITHUB_WORKSPACE && ./tools/unix_2a_build-osg

    - name: Check cache for simbody
      id: cache_simbody
      uses: actions/cache@v3
      with:
        path: ${{ env.SIMBODY_INSTALL_PATH }}
        key: ${{ runner.os }}-simbody-${{ hashFiles('simbody/Simbody') }}

    - name: Build simbody (if not cached)
      if: steps.cache_simbody.outputs.cache-hit != 'true'
      run: cd $GITHUB_WORKSPACE && ./tools/unix_2b_build-simbody



    - name: Cache opensim3
      id: cache_opensim3
      uses: actions/cache@v3
      with:
        path: ${{ env.OPENSIM3_INSTALL_PATH }}
        key: ${{ runner.os }}-opensim3-${{ hashFiles('opensim3-scone/OpenSim') }}

    - name: Build opensim3 (if not cached)
      if: steps.cache_opensim3.outputs.cache-hit != 'true'
      run: cd $GITHUB_WORKSPACE && ./tools/unix_2c_build-opensim3

    - name: Build SCONE
      run: cd $GITHUB_WORKSPACE && ./tools/unix_2d_build-scone

    - name: Rearrange SCONE into portable install dir
      run: cd $GITHUB_WORKSPACE && ./tools/mac_3_create-install-dirtree

    - name: Create .dmg file from the tree
      run: cd $GITHUB_WORKSPACE && ./tools/mac_4_create-dmg

    - name: Upload DMG file as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: sconestudio-dmg
        path: build/*.dmg

    - name: Set release tag
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' || github.ref_type == 'tag' }}
      run: echo "RELEASE_TAG=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}" >> $GITHUB_ENV

    - name: Upload DMG to GitHub Release
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' || github.ref_type == 'tag' }}
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.dmg
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        fail_on_unmatched_files: true

  linux:
    name: Build on Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: List directory structure
      run: ls -R

    - name: Get Dependencies
      run: cd $GITHUB_WORKSPACE && ./tools/linux_1_get-dependencies

    # note: this step is specifically because ubuntu-18.04 does not
    # provide a C++17 compiler. It can be skipped in newer distros
    # - name: Install gcc-8 and g++8
    #   run: |
    #     sudo apt-get install gcc-8 g++-8
    #     sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-7 700 --slave /usr/bin/g++ g++ /usr/bin/g++-7
    #     sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 800 --slave /usr/bin/g++ g++ /usr/bin/g++-8


    # openscenegraph: only build it if its source files have changed
    - name: Cache openscenegraph
      id: cache_osg
      uses: actions/cache@v3
      with:
        path: ${{ env.OSG_INSTALL_PATH }}
        key: ${{ runner.os }}-osg-${{ hashFiles('OpenSceneGraph/src') }}

    - name: Build openscenegraph (if not cached)
      if: steps.cache_osg.outputs.cache-hit != 'true'
      run: cd $GITHUB_WORKSPACE && ./tools/unix_2a_build-osg


    # simbody: only build it if its source files have changed
    - name: Cache simbody
      id: cache_simbody
      uses: actions/cache@v3
      with:
        path: ${{ env.SIMBODY_INSTALL_PATH }}
        key: ${{ runner.os }}-simbody-${{ hashFiles('simbody/Simbody') }}

    - name: Build simbody (if not cached)
      if: steps.cache_simbody.outputs.cache-hit != 'true'
      run: cd $GITHUB_WORKSPACE && ./tools/unix_2b_build-simbody


    # opensim3: only build it if its source files have changed
    - name: Cache opensim3
      id: cache_opensim3
      uses: actions/cache@v3
      with:
        path: ${{ env.OPENSIM3_INSTALL_PATH }}
        key: ${{ runner.os }}-opensim3-${{ hashFiles('opensim3-scone/OpenSim') }}

    - name: Build opensim3 (if not cached)
      if: steps.cache_opensim3.outputs.cache-hit != 'true'
      run: cd $GITHUB_WORKSPACE && ./tools/unix_2c_build-opensim3


    - name: Build SCONE
      run: cd $GITHUB_WORKSPACE && ./tools/unix_2d_build-scone


    - name: Rearrange binaries into single dir
      run: cd $GITHUB_WORKSPACE && ./tools/linux_3_create-install-dirtree


    - name: Package dir into deb package
      run: cd $GITHUB_WORKSPACE && ./tools/linux_4_package


    - name: Upload deb package artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-installer.zip
        path: build/*.deb

    - name: Set release tag
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' || github.ref_type == 'tag' }}
      run: echo "RELEASE_TAG=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}" >> $GITHUB_ENV

    - name: Upload deb to GitHub Release
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' || github.ref_type == 'tag' }}
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.deb
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        fail_on_unmatched_files: true

  windows:
    name: Build on Windows (Visual Studio 2022)
    runs-on: windows-2022
    env:
      OSG_INSTALL_PATH: C:\\OpenSceneGraph-install
      OPENSIM3_INSTALL_PATH: C:\\opensim3-install
      SIMBODY_INSTALL_PATH: C:\\simbody-install
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Setup CMake 3.27
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: 3.27.9

    - name: Install NSIS (for CPack) and 7zip
      run: |
        choco feature enable -n=allowGlobalConfirmation
        choco install -y nsis 7zip
      shell: pwsh

    - name: Get Dependencies (Windows)
      # This is a lightweight bootstrap. In production you'll want to use
      # prebuilt binaries for OSG, OpenSim or use vcpkg. See BUILD.md for
      # recommended ways to provide OpenSim/OpenSceneGraph/Qt on Windows.
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        ./tools/windows_1_get-dependencies.ps1

    - name: Cache openscenegraph
      id: cache_osg
      uses: actions/cache@v3
      with:
        path: ${{ env.OSG_INSTALL_PATH }}
        key: ${{ runner.os }}-osg-${{ hashFiles('OpenSceneGraph/src') }}

    - name: Build openscenegraph (if not cached)
      if: steps.cache_osg.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        ./tools/windows_2a_build-osg.ps1

    - name: Cache simbody
      id: cache_simbody
      uses: actions/cache@v3
      with:
        path: ${{ env.SIMBODY_INSTALL_PATH }}
        key: ${{ runner.os }}-simbody-${{ hashFiles('simbody/Simbody') }}

    - name: Build simbody (if not cached)
      if: steps.cache_simbody.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        ./tools/windows_2b_build-simbody.ps1

    - name: Cache opensim3
      id: cache_opensim3
      uses: actions/cache@v3
      with:
        path: ${{ env.OPENSIM3_INSTALL_PATH }}
        key: ${{ runner.os }}-opensim3-${{ hashFiles('opensim3-scone/OpenSim') }}

    - name: Build opensim3 (if not cached)
      if: steps.cache_opensim3.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        ./tools/windows_2c_build-opensim3.ps1

    - name: Build SCONE (windows script)
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        ./tools/windows_2d_build-scone.ps1

    - name: Generate installer (CPack NSIS)
      shell: pwsh
      run: |
        cpack -G NSIS
      working-directory: ${{ github.workspace }}/build

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: sconestudio-nsis
        path: build/*.exe

    - name: Set release tag
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' || github.ref_type == 'tag' }}
      run: echo "RELEASE_TAG=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}" >> $GITHUB_ENV

    - name: Upload installer to GitHub Release
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' || github.ref_type == 'tag' }}
      uses: softprops/action-gh-release@v1
      with:
        files: build/*.exe
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_TAG }}
        fail_on_unmatched_files: true
